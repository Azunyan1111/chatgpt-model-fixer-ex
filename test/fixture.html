<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>ChatGPT Model Fixer Browser Test</title>
</head>
<body>
  <div role="group" aria-label="作成モード">
    <button type="button" data-mode="chat" aria-pressed="true">Chat</button>
    <button type="button" data-mode="codex" aria-pressed="false">Work</button>
  </div>

  <button
    type="button"
    data-codex-intelligence-trigger="true"
    aria-controls="model-menu"
    aria-expanded="false"
  >モデルを選択</button>

  <div id="model-menu" role="menu" hidden>
    <div data-model-items></div>
    <div data-model-picker-power-slider>
      <span
        role="slider"
        tabindex="0"
        aria-valuemin="0"
        aria-valuemax="4"
        aria-valuenow="2"
      ></span>
    </div>
  </div>

  <script>
    const models = {
      chat: [
        { name: 'GPT-6', maximumEffort: 4 },
        { name: 'GPT-5.6 Sol', maximumEffort: 4 },
      ],
      codex: [
        { name: 'デフォルト', maximumEffort: 5 },
        { name: 'GPT-6.1 Sol', maximumEffort: 5 },
        { name: 'GPT-6 Astra', maximumEffort: 5 },
        { name: 'GPT-6 Sol', maximumEffort: 5 },
        { name: 'GPT-6 Luna', maximumEffort: 4 },
        { name: 'GPT-5.6 Sol', maximumEffort: 5 },
        { name: 'GPT-5.6 Terra', maximumEffort: 5 },
        { name: 'GPT-5.6 Luna', maximumEffort: 4 },
      ],
    };

    const state = {
      effort: { chat: 2, codex: 2 },
      mode: 'chat',
      model: { chat: 'GPT-6', codex: 'デフォルト' },
    };
    const menu = document.querySelector('[role="menu"]');
    const slider = document.querySelector('[role="slider"]');
    const trigger = document.querySelector('[data-codex-intelligence-trigger]');

    function currentModel() {
      return models[state.mode].find(({ name }) => name === state.model[state.mode]);
    }

    function renderMode() {
      for (const button of document.querySelectorAll('[data-mode]')) {
        button.setAttribute('aria-pressed', String(button.dataset.mode === state.mode));
      }
    }

    function renderModels() {
      const items = document.querySelector('[data-model-items]');
      items.replaceChildren(...models[state.mode].map(({ name }) => {
        const item = document.createElement('div');
        item.setAttribute('role', 'menuitemradio');
        item.setAttribute('aria-checked', String(name === state.model[state.mode]));
        item.innerHTML = `<div data-menu-row-content><span>${name}</span></div>`;
        item.addEventListener('click', () => {
          state.model[state.mode] = name;
          for (const candidate of items.querySelectorAll('[role="menuitemradio"]')) {
            candidate.setAttribute('aria-checked', String(candidate === item));
          }
          renderSlider();
        });
        return item;
      }));
    }

    function renderSlider() {
      const maximum = currentModel().maximumEffort;
      state.effort[state.mode] = Math.min(maximum, state.effort[state.mode]);
      slider.setAttribute('aria-valuemax', String(maximum));
      slider.setAttribute('aria-valuenow', String(state.effort[state.mode]));
    }

    function render() {
      renderMode();
      renderModels();
      renderSlider();
    }

    for (const button of document.querySelectorAll('[data-mode]')) {
      button.addEventListener('click', () => {
        state.mode = button.dataset.mode;
        render();
      });
    }

    trigger.addEventListener('pointerdown', () => {
      trigger.setAttribute('aria-expanded', 'true');
      menu.hidden = false;
    });

    menu.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') {
        trigger.setAttribute('aria-expanded', 'false');
        menu.hidden = true;
      }
    });

    slider.addEventListener('keydown', (event) => {
      const current = Number(slider.getAttribute('aria-valuenow'));
      const maximum = Number(slider.getAttribute('aria-valuemax'));
      if (event.key === 'ArrowRight') state.effort[state.mode] = Math.min(maximum, current + 1);
      if (event.key === 'ArrowLeft') state.effort[state.mode] = Math.max(0, current - 1);
      slider.setAttribute('aria-valuenow', String(state.effort[state.mode]));
    });

    render();
  </script>
</body>
</html>
